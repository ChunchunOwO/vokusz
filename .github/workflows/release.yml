name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: beta
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate tag matches pubspec version
        working-directory: Client
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f1)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pubspec.yaml version $VERSION"
            exit 1
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Windows
    needs: [verify, ci]
    runs-on: windows-2022
    defaults:
      run:
        working-directory: Client
    env:
      WINDOWS_SIGN_AVAILABLE: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' || (secrets.SIMPLYSIGN_USER != '' && secrets.SIMPLYSIGN_TOTP_SECRET != '') }}
      SIMPLYSIGN_AVAILABLE: ${{ secrets.WINDOWS_CERT_PFX_BASE64 == '' && secrets.SIMPLYSIGN_USER != '' && secrets.SIMPLYSIGN_TOTP_SECRET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require Windows signing credentials
        if: env.WINDOWS_SIGN_AVAILABLE != 'true'
        shell: bash
        run: |
          echo "::error::Windows signing credentials are required for tagged releases."
          exit 1

      - name: Resolve version
        id: version
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Cache pub + native deps
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('Client/pubspec.lock') }}

      - name: Install NASM
        run: choco install nasm -y
        shell: powershell

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        shell: bash
        run: flutter pub get

      - name: Code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows -v

      - name: Open SimplySign session
        if: env.SIMPLYSIGN_AVAILABLE == 'true'
        shell: pwsh
        env:
          SIMPLYSIGN_USER: ${{ secrets.SIMPLYSIGN_USER }}
          SIMPLYSIGN_TOTP_SECRET: ${{ secrets.SIMPLYSIGN_TOTP_SECRET }}
        run: ./dist/simplysign-login.ps1 -Required

      - name: Sign binaries
        if: env.WINDOWS_SIGN_AVAILABLE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          ./dist/sign-windows.ps1 -Required `
            build/windows/x64/runner/Release/vokusz.exe `
            build/windows/x64/runner/Release/*.dll

      - name: Package zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath vokusz-windows-x86_64.zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: powershell

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.APP_VERSION }}" dist\installer.iss

      - name: Sign installer
        if: env.WINDOWS_SIGN_AVAILABLE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: ./dist/sign-windows.ps1 -Required vokusz-windows-x86_64-setup.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vokusz-windows-x86_64
          path: |
            Client/vokusz-windows-x86_64.zip
            Client/vokusz-windows-x86_64-setup.exe

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
