<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vokusz：免费屏幕共享，流畅稳定的语音与社区聊天。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vokusz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Vokusz</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      /* Match the app's dark preset (lib/theme/app_theme.dart): background
         #27292C, accent #5764F1, high-emphasis text #D5D9DF, muted #939BA3. */
      background-color: #27292C;
      color: #D5D9DF;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .boot {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .mark {
      font-size: clamp(48px, 9vw, 76px);
      font-weight: 600;
      letter-spacing: 0.08em;
      line-height: 1;
      background-image: linear-gradient(
        100deg,
        rgba(213, 217, 223, 0.45) 0%,
        rgba(213, 217, 223, 0.45) 36%,
        #D5D9DF 46%,
        #8B96FF 52%,
        #5764F1 58%,
        rgba(213, 217, 223, 0.45) 68%,
        rgba(213, 217, 223, 0.45) 100%
      );
      background-size: 220% 100%;
      background-position: 100% 0;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: vokusz-shimmer 4s linear infinite;
    }

    .spin {
      width: 28px;
      height: 28px;
      margin: 36px 0 18px;
      border-radius: 50%;
      border: 2px solid rgba(213, 217, 223, 0.16);
      border-top-color: #5764F1;
      animation: vokusz-spin 0.8s linear infinite;
    }

    .hint {
      font-size: 14px;
      color: #5C636B;
    }

    @keyframes vokusz-shimmer {
      from { background-position: 120% 0; }
      to { background-position: -120% 0; }
    }

    @keyframes vokusz-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark, .spin { animation: none; }
      .mark { background-position: 40% 0; }
    }
  </style>
</head>

<body>
  <div class="boot">
    <div class="mark">Vokusz</div>
    <div class="spin" role="progressbar" aria-label="正在加载"></div>
    <div class="hint">正在加载 Vokusz</div>
  </div>

  <script>
    try {
      const english = localStorage.getItem('vokusz-language') === 'en';
      document.documentElement.lang = english ? 'en' : 'zh-CN';
      document.querySelector('.hint').textContent = english ? 'Loading Vokusz' : '正在加载 Vokusz';
      document.querySelector('.spin').setAttribute('aria-label', english ? 'Loading' : '正在加载');
    } catch (_) { /* Storage may be disabled; use the default language. */ }

    // Service-worker update bridge (#91). Surfaces a newer deployed build to the
    // running tab so the app can offer a one-tap reload instead of relying on a
    // manual refresh. Read by lib/features/updates/services/web_update_web.dart.
    (function () {
      window.vokuszUpdateAvailable = false;

      window.vokuszApplyUpdate = function () {
        if (!('serviceWorker' in navigator)) {
          window.location.reload();
          return;
        }
        navigator.serviceWorker.getRegistration().then(function (reg) {
          // Best-effort: ask a waiting worker to take over immediately. The
          // default Flutter worker may ignore this, in which case the reload
          // (and eventually closing every tab) still activates the new build.
          if (reg && reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          window.location.reload();
        }).catch(function () { window.location.reload(); });
      };

      if ('serviceWorker' in navigator) {
        var markAvailable = function () {
          window.vokuszUpdateAvailable = true;
        };
        var watch = function (reg) {
          if (!reg) return;
          if (reg.waiting && navigator.serviceWorker.controller) markAvailable();
          reg.addEventListener('updatefound', function () {
            var installing = reg.installing;
            if (!installing) return;
            installing.addEventListener('statechange', function () {
              if (installing.state === 'installed' &&
                  navigator.serviceWorker.controller) {
                markAvailable();
              }
            });
          });
        };
        navigator.serviceWorker.ready.then(watch).catch(function () {});
        // Poll for a new deploy while the tab stays open (every 30 minutes).
        setInterval(function () {
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (reg) reg.update().catch(function () {});
          }).catch(function () {});
        }, 1800000);
      }
    })();
  </script>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.querySelector('.boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
